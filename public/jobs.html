<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>W-JOB — Emplois</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --em:#10b981;--em-l:#34d399;--em-d:#059669;--teal:#14b8a6;
      --bg:#030d12;
      --glass:rgba(255,255,255,.052);--gb:rgba(16,185,129,.16);--gh:rgba(255,255,255,.085);
      --text:#f0fdf8;--muted:#6b9e8e;--dim:#a3c4bc;
    }

    /* ── LIGHT MODE ── */
    [data-theme="light"]{--bg:#f0fdf8;--glass:rgba(0,0,0,.04);--gb:rgba(16,185,129,.18);--gh:rgba(0,0,0,.06);--text:#0f172a;--muted:#4b7a6c;--dim:#2d5c4e}
    [data-theme="light"] body::before{background:radial-gradient(ellipse 60% 50% at 12% -5%,rgba(16,185,129,.09) 0%,transparent 55%),radial-gradient(ellipse 45% 40% at 88% 105%,rgba(20,184,166,.06) 0%,transparent 50%),linear-gradient(160deg,#f0fdf8 0%,#e5f7f0 100%)}
    [data-theme="light"] .topnav{background:rgba(240,253,248,.88);border-bottom-color:rgba(16,185,129,.22)}
    [data-theme="light"] .nav-link{color:var(--dim)}
    [data-theme="light"] .nav-link:hover{background:rgba(0,0,0,.05);color:var(--text)}
    [data-theme="light"] .nav-link.active{color:var(--em);background:rgba(16,185,129,.1)}
    [data-theme="light"] .icon-btn{background:rgba(255,255,255,.6);border-color:rgba(16,185,129,.2)}
    [data-theme="light"] .stat-pill,[data-theme="light"] .job-card,[data-theme="light"] .sidebar-filter{background:rgba(255,255,255,.75);border-color:rgba(16,185,129,.2)}
    [data-theme="light"] .job-card:hover{background:rgba(255,255,255,.95)}
    [data-theme="light"] .filter-btn{background:rgba(255,255,255,.6);color:var(--dim)}
    [data-theme="light"] .search-bar{background:rgba(255,255,255,.75);border-color:rgba(16,185,129,.2)}
    [data-theme="light"] .job-tag{background:rgba(0,0,0,.06);color:var(--muted)}
    [data-theme="light"] .job-footer{border-top-color:rgba(0,0,0,.07)}
    [data-theme="light"] .sidebar-label{color:var(--muted)}

    .icon-sun{display:block}.icon-moon{display:none}
    [data-theme="light"] .icon-sun{display:none}[data-theme="light"] .icon-moon{display:block}

    body{transition:background .45s ease,color .45s ease}
    .topnav{transition:background .45s ease,border-color .45s ease}
    .job-card,.stat-pill{transition:background .45s ease,border-color .45s ease,transform .32s cubic-bezier(.16,1,.3,1),box-shadow .32s}

    #theme-flash{position:fixed;inset:0;z-index:9999;pointer-events:none;background:rgba(255,255,255,0)}
    #theme-flash.flash-dark{animation:flashOut .4s ease forwards;background:rgba(0,0,0,.18)}
    #theme-flash.flash-light{animation:flashOut .4s ease forwards;background:rgba(255,255,255,.22)}
    @keyframes flashOut{0%{opacity:1}100%{opacity:0}}

    html{scroll-behavior:smooth}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(ellipse 60% 50% at 12% -5%,rgba(16,185,129,.14) 0%,transparent 55%),
                 radial-gradient(ellipse 45% 40% at 88% 105%,rgba(20,184,166,.09) 0%,transparent 50%),
                 linear-gradient(160deg,#030d12 0%,#071a20 100%)}

    /* ── TOP NAV ── */
    .topnav{position:sticky;top:0;z-index:100;height:60px;padding:0 2rem;
      display:flex;align-items:center;justify-content:space-between;gap:1.5rem;
      background:rgba(3,13,18,.8);backdrop-filter:blur(28px) saturate(1.5);
      border-bottom:1px solid rgba(16,185,129,.11)}
    .nav-logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;flex-shrink:0}
    .nav-logo-icon{width:32px;height:32px;flex-shrink:0}
    .nav-logo-text{font-size:1.25rem;font-weight:900;letter-spacing:-.5px;background:linear-gradient(135deg,var(--em-l),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .nav-links{display:flex;align-items:center;gap:.25rem;flex:1;justify-content:center}
    .nav-link{display:flex;align-items:center;gap:.45rem;padding:.42rem .85rem;border-radius:8px;font-size:.85rem;font-weight:500;color:var(--dim);text-decoration:none;transition:all .2s;white-space:nowrap}
    .nav-link svg{width:15px;height:15px;stroke-width:2;flex-shrink:0}
    .nav-link:hover{color:var(--text);background:var(--gh)}
    .nav-link.active{color:var(--em-l);background:rgba(16,185,129,.12)}
    .nav-link .badge{background:var(--em-d);color:#fff;font-size:.6rem;font-weight:700;padding:.1rem .42rem;border-radius:999px;line-height:1.4}
    .nav-right{display:flex;align-items:center;gap:.6rem;flex-shrink:0}
    .icon-btn{width:36px;height:36px;border-radius:9px;background:var(--glass);border:1px solid var(--gb);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;color:var(--dim)}
    .icon-btn svg{width:16px;height:16px;stroke-width:1.8}
    .icon-btn:hover{background:var(--gh);color:var(--em-l);border-color:rgba(16,185,129,.35)}
    .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--em-d),var(--em));display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 0 16px rgba(16,185,129,.32)}

    /* ── PAGE ── */
    .page{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:2rem 2rem 4rem}

    .fade-in{opacity:0;transform:translateY(16px);animation:fadeIn .55s cubic-bezier(.16,1,.3,1) forwards}
    .fi1{animation-delay:.05s}.fi2{animation-delay:.12s}.fi3{animation-delay:.2s}.fi4{animation-delay:.28s}
    @keyframes fadeIn{to{opacity:1;transform:translateY(0)}}

    /* PAGE HEADER */
    .page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2rem;flex-wrap:wrap;gap:1rem}
    .page-header h2{font-size:1.6rem;font-weight:800;letter-spacing:-.5px}
    .page-header p{color:var(--muted);margin-top:.3rem;font-size:.875rem}

    /* STATS */
    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.75rem}
    .stat-pill{background:var(--glass);border:1px solid var(--gb);border-radius:14px;padding:1rem 1.25rem;backdrop-filter:blur(20px);display:flex;align-items:center;gap:.9rem;transition:all .3s cubic-bezier(.16,1,.3,1);cursor:default}
    .stat-pill:hover{transform:translateY(-3px);border-color:rgba(16,185,129,.35);box-shadow:0 12px 35px rgba(16,185,129,.12)}
    .stat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .3s}
    .stat-pill:hover .stat-icon{transform:scale(1.1) rotate(-6deg)}
    .stat-icon svg{width:17px;height:17px;stroke-width:2}
    .stat-val{font-size:1.6rem;font-weight:800;line-height:1}
    .stat-lbl{font-size:.7rem;color:var(--muted);font-weight:500;margin-top:.15rem}

    /* SEARCH BAR */
    .search-bar{display:flex;align-items:center;gap:.75rem;background:var(--glass);border:1px solid var(--gb);border-radius:14px;padding:.8rem 1.2rem;margin-bottom:1.25rem;backdrop-filter:blur(20px);transition:border-color .2s}
    .search-bar:focus-within{border-color:rgba(16,185,129,.4)}
    .search-bar svg{width:18px;height:18px;stroke-width:1.8;color:var(--muted);flex-shrink:0}
    .search-bar input{background:none;border:none;outline:none;font-family:'Inter',sans-serif;font-size:.9rem;color:var(--text);flex:1}
    .search-bar input::placeholder{color:var(--muted)}
    .search-bar-divider{width:1px;height:20px;background:var(--gb)}

    /* FILTERS */
    .filters{display:flex;gap:.5rem;margin-bottom:1.75rem;flex-wrap:wrap}
    .filter-btn{padding:.4rem .9rem;border-radius:999px;font-size:.78rem;font-weight:600;cursor:pointer;border:1px solid var(--gb);background:var(--glass);color:var(--dim);transition:all .22s;backdrop-filter:blur(10px);display:flex;align-items:center;gap:.35rem}
    .filter-btn svg{width:12px;height:12px;stroke-width:2}
    .filter-btn:hover,.filter-btn.active{background:rgba(16,185,129,.14);border-color:rgba(16,185,129,.38);color:var(--em-l)}

    /* LAYOUT: list + sidebar */
    .content-layout{display:grid;grid-template-columns:1fr 280px;gap:1.5rem;align-items:start}

    /* JOB LIST */
    .jobs-count{font-size:.82rem;color:var(--muted);margin-bottom:1rem;font-weight:500}
    .jobs-count span{color:var(--em-l);font-weight:700}
    .job-card{background:var(--glass);border:1px solid var(--gb);border-radius:16px;padding:1.25rem 1.4rem;margin-bottom:.85rem;backdrop-filter:blur(20px);cursor:pointer;position:relative;overflow:hidden}
    .job-card::after{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);transition:left .55s}
    .job-card:hover::after{left:130%}
    .job-card:hover{border-color:rgba(16,185,129,.32);box-shadow:0 8px 32px rgba(16,185,129,.1);transform:translateY(-2px)}
    .job-card.featured{border-color:rgba(16,185,129,.28);background:linear-gradient(135deg,rgba(16,185,129,.07),rgba(20,184,166,.03))}

    .job-top{display:flex;align-items:flex-start;gap:1rem;margin-bottom:.85rem}
    .job-logo{width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,rgba(16,185,129,.18),rgba(20,184,166,.1));border:1px solid rgba(16,185,129,.22);display:flex;align-items:center;justify-content:center;color:var(--em-l);flex-shrink:0;transition:transform .25s}
    .job-card:hover .job-logo{transform:scale(1.08) rotate(-5deg)}
    .job-logo svg{width:20px;height:20px;stroke-width:1.8}
    .job-info{flex:1}
    .job-role{font-size:.95rem;font-weight:700;line-height:1.35;margin-bottom:.2rem}
    .job-meta{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
    .job-meta svg{width:12px;height:12px;stroke-width:2;flex-shrink:0}
    .job-meta-item{display:flex;align-items:center;gap:.25rem}
    .job-score{flex-shrink:0;text-align:right}
    .score-ring{width:44px;height:44px;position:relative;display:flex;align-items:center;justify-content:center}
    .score-ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg)}
    .score-val{font-size:.72rem;font-weight:800;color:var(--em-l);position:relative;z-index:1}
    .job-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.85rem}
    .job-tag{font-size:.65rem;font-weight:600;padding:.15rem .52rem;border-radius:6px;background:rgba(255,255,255,.06);color:var(--dim)}
    .job-tag.highlight{background:rgba(16,185,129,.12);color:var(--em-l);border:1px solid rgba(16,185,129,.2)}
    .job-footer{display:flex;justify-content:space-between;align-items:center;padding-top:.85rem;border-top:1px solid rgba(255,255,255,.05)}
    .job-date{font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:.3rem}
    .job-date svg{width:11px;height:11px;stroke-width:2}
    .job-actions{display:flex;gap:.5rem}
    .btn-save{padding:.38rem .7rem;border-radius:8px;border:1px solid var(--gb);background:var(--glass);color:var(--dim);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:600}
    .btn-save svg{width:13px;height:13px;stroke-width:2}
    .btn-save:hover{border-color:rgba(16,185,129,.4);color:var(--em-l)}
    .btn-apply{padding:.38rem 1rem;border-radius:8px;background:linear-gradient(135deg,var(--em-d),var(--em));color:#fff;border:none;cursor:pointer;font-size:.72rem;font-weight:700;transition:all .25s;font-family:'Inter',sans-serif}
    .btn-apply:hover{transform:translateY(-1px);box-shadow:0 0 20px rgba(16,185,129,.4)}

    /* SIDEBAR */
    .sidebar-filter{background:var(--glass);border:1px solid var(--gb);border-radius:16px;padding:1.25rem;backdrop-filter:blur(20px)}
    .sidebar-section{margin-bottom:1.5rem}
    .sidebar-section:last-child{margin-bottom:0}
    .sidebar-label{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem;display:block}
    .check-item{display:flex;align-items:center;gap:.6rem;padding:.35rem 0;cursor:pointer;font-size:.82rem;color:var(--dim);transition:color .2s}
    .check-item:hover{color:var(--text)}
    .check-box{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--gb);background:var(--glass);flex-shrink:0;transition:all .2s;display:flex;align-items:center;justify-content:center}
    .check-item.checked .check-box{background:var(--em);border-color:var(--em)}
    .check-item.checked .check-box::after{content:'';width:8px;height:5px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block}
    .check-item.checked{color:var(--text)}
    .range-bar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;margin:0.5rem 0;position:relative}
    .range-fill{height:100%;background:linear-gradient(90deg,var(--em-d),var(--em));border-radius:2px;width:70%}
    .range-labels{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted)}

    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(16,185,129,.3);border-radius:2px}
    @media(max-width:1024px){.content-layout{grid-template-columns:1fr}.sidebar-filter{display:none}}
    @media(max-width:900px){.stats-row{grid-template-columns:repeat(2,1fr)}.nav-links .nav-link span{display:none}}
    @media(max-width:600px){.topnav{padding:0 1rem}}
      .logo-badge{display:inline-flex;align-items:baseline;gap:2px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);border-radius:8px;padding:5px 12px 5px 10px;line-height:1;text-decoration:none}    .logo-w{font-size:18px;font-weight:900;color:#fff;letter-spacing:-1px}    .logo-job{font-size:12px;font-weight:700;color:#10b981;letter-spacing:2.5px}    [data-theme=light] .logo-badge{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.35)}    [data-theme=light] .logo-w{color:#0f172a}

    /* TOASTS + MODAL + EMPTY STATE */
    #toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
    .toast{display:flex;align-items:center;gap:12px;background:rgba(10,20,32,.97);backdrop-filter:blur(20px);border:1px solid var(--gb);border-radius:12px;padding:.75rem 1rem;font-size:.85rem;color:var(--text);opacity:0;transform:translateX(24px);transition:all .3s;pointer-events:auto}
    [data-theme="light"] .toast{background:rgba(255,255,255,.97)}
    .toast.toast-show{opacity:1;transform:translateX(0)}
    .toast-icon{flex-shrink:0;display:flex}
    .toast-success{border-left:2px solid #10b981}.toast-error{border-left:2px solid #f43f5e}.toast-info{border-left:2px solid #3b82f6}.toast-warning{border-left:2px solid #f59e0b}
    .empty-state{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:.875rem;background:var(--glass);border:1px dashed var(--gb);border-radius:16px}
    .empty-state a{color:var(--em-l);font-weight:600;text-decoration:none}
    .skeleton{background:linear-gradient(90deg,var(--glass) 25%,var(--gh) 50%,var(--glass) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:16px;height:150px;margin-bottom:.85rem;border:1px solid var(--gb)}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .field-select{background:var(--glass);border:1px solid var(--gb);border-radius:10px;padding:.5rem .7rem;color:var(--text);font-family:'Inter',sans-serif;font-size:.82rem;width:100%;outline:none;cursor:pointer}
    .field-select option{background:#071a20;color:#f0fdf8}
    .modal-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:1rem}
    .modal-overlay.hidden{display:none}
    .modal-box{background:#071a20;border:1px solid var(--gb);border-radius:18px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;padding:1.5rem}
    [data-theme="light"] .modal-box{background:#fff}
    .modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem}
    .modal-head h3{font-size:1.15rem;font-weight:800}
    .modal-close{background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer;line-height:1}
    .modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:1.25rem}
    .btn-danger{padding:.6rem 1rem;border-radius:10px;border:1px solid rgba(244,63,94,.35);background:rgba(244,63,94,.1);color:#fb7185;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
</style>
</head>

      <button class="icon-btn" id="themeToggle" title="Mode clair / sombre" aria-label="Changer le thème">

  <script>

    // ── THEME TOGGLE ──
    const root = document.documentElement;
    root.dataset.theme = localStorage.getItem('wjob-theme') || 'dark';

    function navBg() {
      const light = root.dataset.theme === 'light';
      const scrolled = window.scrollY > 10;
      document.querySelector('.topnav').style.background = scrolled
        ? (light ? 'rgba(240,253,248,.96)' : 'rgba(3,13,18,.9)')
        : (light ? 'rgba(240,253,248,.88)' : 'rgba(3,13,18,.75)');
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      const flash = document.getElementById('theme-flash');
      flash.className = next === 'light' ? 'flash-light' : 'flash-dark';
      flash.addEventListener('animationend', () => { flash.className = ''; }, { once: true });
      root.dataset.theme = next;
      localStorage.setItem('wjob-theme', next);
      navBg();
    });

    window.addEventListener('scroll', navBg);
  </script>
